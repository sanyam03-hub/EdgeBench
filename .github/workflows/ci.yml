name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          # PyPI as extra index: the CPU index alone can serve deps as sdists that fail to build.
          pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Install edgebench
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -m "not data and not slow"

      # Smoke run: tiny_cnn on synthetic data (no dataset, no pretrained weights).
      - name: Smoke run
        run: |
          edgebench run --config configs/smoke_tiny.yaml --target configs/targets/ci.yaml
          echo "RESULTS=$(ls results/*.json)" >> "$GITHUB_ENV"

      - name: Report
        run: edgebench report --results "$RESULTS"

      # Accuracy + parity are gated; latency is printed only (shared runners are noisy).
      - name: Regression gate
        run: edgebench gate --results "$RESULTS" --baseline baselines/ci.json

      # Uploaded even when the gate fails, so a CI-made baseline can be created from it.
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results/
          if-no-files-found: warn
